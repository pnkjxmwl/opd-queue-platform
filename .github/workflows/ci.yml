name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opd
          POSTGRES_PASSWORD: opd_local_dev
          POSTGRES_DB: opd
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U opd -d opd"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      DATABASE_URL: postgresql://opd:opd_local_dev@localhost:5433/opd?schema=public
      REDIS_URL: redis://localhost:6380
      # CI-only throwaway secrets. Real ones come from the platform per environment.
      JWT_ACCESS_SECRET: ci-access-secret-000000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-00000000000000000
      CHECKIN_SECRET: ci-checkin-secret-00000000000000000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated code - CI must build it, never assume it.
      - run: pnpm --filter @opd/api prisma:generate

      # Integration tests need the schema applied, not just the client generated.
      - run: pnpm --filter @opd/api exec prisma migrate deploy

      - run: pnpm lint
      - run: pnpm typecheck

      # Build BEFORE seeding and testing, which is a change of order and not just a
      # reshuffle.
      #
      # The seed runs `nest build`, which imports @opd/contracts - a workspace package
      # that does not exist until it is built. And the console walkthrough inside
      # `pnpm test` drives a REAL clinic: it signs in as reception@apollo.test and
      # doctor@apollo.test, seeded accounts with real password hashes and role
      # memberships. That dependency is deliberate - the walkthrough tests the console
      # against a realistic hospital rather than a hand-built stub - so the data has to
      # be there before the tests run, and the build has to be there before the seed.
      #
      # Safe to seed here: the seed refuses to run against a database holding a
      # hospital it did not create, and CI's is always fresh.
      - run: pnpm build
      - run: pnpm --filter @opd/api seed
      - run: pnpm test
