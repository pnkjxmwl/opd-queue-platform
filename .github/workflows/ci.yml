name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opd
          POSTGRES_PASSWORD: opd_local_dev
          POSTGRES_DB: opd
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U opd -d opd"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      DATABASE_URL: postgresql://opd:opd_local_dev@localhost:5433/opd?schema=public
      REDIS_URL: redis://localhost:6380
      # CI-only throwaway secrets. Real ones come from the platform per environment.
      JWT_ACCESS_SECRET: ci-access-secret-000000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-00000000000000000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated code - CI must build it, never assume it.
      - run: pnpm --filter @opd/api prisma:generate

      # Integration tests need the schema applied, not just the client generated.
      - run: pnpm --filter @opd/api exec prisma migrate deploy

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
