# Local development dependencies only. Nothing here ships to staging/production.
# Ports are deliberately non-default: 5432/6379 are commonly already bound on
# Windows dev machines by an existing Postgres/Redis install.
services:
  postgres:
    image: postgres:16-alpine
    container_name: opd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opd
      POSTGRES_PASSWORD: opd_local_dev
      POSTGRES_DB: opd
    ports:
      - '5433:5432'
    volumes:
      - opd-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opd -d opd']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: opd-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - opd-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  opd-pgdata:
  opd-redisdata:
